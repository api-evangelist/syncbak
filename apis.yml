aid: syncbak
name: Syncbak
description: >-
  Syncbak is a Marion, Iowa media-technology company founded in 2009 by Jack Perry that built the
  streaming infrastructure local U.S. television broadcasters use to put their over-the-air signals
  online. Its SimpleSync / MediaMogul platform handles live-stream transcoding, cloud-based rights
  resolution and geo-location authentication, cloud DVR, device filtering, content management,
  stream monitoring, clipping, and dynamic ad insertion through its AdSync product, delivering
  station feeds to OTT destinations including Paramount+, Hulu, fuboTV, Amazon, Roku, Apple TV and
  the NFL across 200+ U.S. markets. The company rebranded to Zeam Media in May 2024 to match its
  Zeam consumer hyperlocal streaming app, and syncbak.com now redirects to zeammedia.com. Syncbak
  publishes no public developer program, API reference, or machine-readable contract; its platform
  is delivered to broadcasters and station groups under commercial agreement.
